# RBAC configuration for the prototype.
#
# Password hashes are PBKDF2-HMAC-SHA256, 100k iterations, salt below (hex).
# Demo passwords (for the CLI): alice/alice123, bob/bob123, carol/carol123, dave/dave123.
# This is a prototype - do not reuse this scheme or these salts for anything real.

roles:
  engineer:
    description: Infra-focused engineer. Can read infra state and scale, not restart.
    agents: [infra]
    tools:
      - infra.get_service_status
      - infra.list_incidents
      - infra.scale_deployment

  it_admin:
    description: IT admin. Full IT support + can restart infra services.
    agents: [infra, it_support]
    tools:
      - "it.*"
      - infra.get_service_status
      - infra.list_incidents
      - infra.restart_service

  employee:
    description: Regular employee. Can raise tickets and request resources for themselves.
    agents: [it_support, resource_alloc]
    tools:
      - it.create_ticket
      - it.get_ticket_status
      - it.list_my_tickets
      - resources.check_quota
      - resources.request_vm
      - resources.request_laptop

  manager:
    description: Manager. Everything, including cross-team quota visibility and approvals.
    agents: [infra, it_support, resource_alloc]
    tools:
      - "*"

